[package]
name = "moonwell-liquidator"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
bigdecimal = "0.4"
dashmap = "6"
serde_json = "1"
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
